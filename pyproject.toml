[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bricknet"
version = "0.1.1"
description = "Accompanying module to BrickNet"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Peter Kulits" }]
dependencies = [
    "numpy",
    "scipy",
    "pybullet>=3.2.7",
    "platformdirs",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
car2brick = ["trimesh", "pillow"]
train = ["torch", "transformers", "peft", "accelerate", "liger-kernel"]

[project.urls]
Paper = "https://kulits.github.io/BrickNet/"

[tool.hatch.build.targets.wheel]
packages = ["src/bricknet", "src/car2brick"]

[tool.hatch.build.targets.sdist]
include = ["/src/bricknet", "/src/car2brick", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.black]
line-length = 120
